version: '3.8'

services:
  db:
    image: postgres:15
    container_name: yrpm_postgres
    restart: always
    environment:
      POSTGRES_USER: yrpm
      POSTGRES_PASSWORD: yrpm_password
      POSTGRES_DB: yrpm_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
